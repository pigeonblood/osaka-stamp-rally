<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E9EDE7">
  <title>大阪市 区役所スタンプラリー</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='43' fill='none' stroke='%23FF3300' stroke-width='9'/%3E%3Ctext x='50' y='66' font-size='46' font-family='serif' font-weight='700' text-anchor='middle' fill='%23FF3300'%3E区%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Shippori+Mincho+B1:wght@700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <div class="masthead__row">
        <h1 class="title"><small>大阪市</small>区役所スタンプラリー</h1>
        <div class="account" id="account"></div>
      </div>
      <div class="progress" id="progress" role="img">
        <ol class="ticks" id="ticks" aria-hidden="true"></ol>
        <p class="tally" id="tally" aria-hidden="true"></p>
      </div>
    </header>

    <div class="notice" id="notice" hidden></div>

    <main>
      <section class="map-wrap" aria-label="地図">
        <div id="map"></div>
        <button type="button" class="locate" id="locate-btn">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3" stroke="currentColor" stroke-width="2"/></svg>
          <span>現在地</span>
        </button>
      </section>

      <section class="book" aria-labelledby="book-title">
        <div class="book__head">
          <h2 id="book-title">スタンプ帳</h2>
          <p class="book__note" id="book-note"></p>
        </div>
        <ul class="book__grid" id="book"></ul>
        <p class="book__foot">区をタップすると地図でその場所を表示します。</p>
      </section>
    </main>
  </div>

  <div class="press" id="press" hidden>
    <div class="press__card" role="dialog" aria-modal="true" aria-labelledby="press-ward">
      <div class="press__slot"><img class="press__img" id="press-img" alt=""></div>
      <p class="press__ward" id="press-ward"></p>
      <p class="press__date" id="press-date"></p>
      <p class="press__count" id="press-count"></p>
      <button type="button" class="press__close" id="press-close">スタンプ帳を見る</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
